<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zozi Jewellery — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent:#d4af37; /* accent color */
      --muted: rgba(255,255,255,0.92);
      --bg-dark: rgba(0,0,0,0.45);
    }
    html,body{
      height:100%;
      margin:0;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      color:var(--muted);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      background:#000;
    }
    /* Background with subtle blur */
    .bg{
      position:fixed;
      inset:0;
      background-image: url('assets/background.svg');
      background-size:cover;
      background-position:center;
      z-index:0;
      transform:scale(1.03);
    }
    .bg::before{
      content:"";
      position:absolute;
      inset:0;
      backdrop-filter: blur(16px) saturate(1.05);
      -webkit-backdrop-filter: blur(16px) saturate(1.05);
      background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.5));
    }

    /* Centered simple layout */
    .wrap{
      position:relative;
      z-index:2;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 24px;
      box-sizing:border-box;
      text-align:center;
    }
    .card{
      max-width:900px;
      width:100%;
      display:flex;
      gap:36px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      min-width:260px;
    }
    .logo{
      width:140px;
      height:140px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,0.02);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.05);
    }
    .logo img{ width:78%; height:78%; object-fit:contain; display:block; }

    h1{
      margin:0;
      font-family: 'Playfair Display', serif;
      font-weight:700;
      color:var(--muted);
      font-size:clamp(22px,3.8vw,40px);
      letter-spacing:0.02em;
    }
    p.lead{
      margin:0;
      color:rgba(255,255,255,0.88);
      max-width:520px;
      line-height:1.6;
      font-size:clamp(15px,1.4vw,18px);
    }

    .services{
      margin-top:8px;
      color:rgba(255,255,255,0.86);
      font-size:14px;
      line-height:1.7;
      text-align:center;
      letter-spacing:0.01em;
    }

    .actions{
      display:flex;
      gap:12px;
      margin-top:12px;
      justify-content:center;
      align-items:center;
    }
    .btn{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:10px 16px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.06);
      color:var(--muted);
      text-decoration:none;
      border-radius:999px;
      font-weight:600;
      font-size:14px;
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s;
    }
    .btn:hover{ transform:translateY(-3px); box-shadow:0 12px 40px rgba(0,0,0,0.6); }
    .btn .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }

    /* Decorative divider */
    .divider{
      width:56px;
      height:2px;
      background:linear-gradient(90deg, rgba(212,175,55,0.95), rgba(212,175,55,0.45));
      margin:18px auto 8px;
      border-radius:2px;
      opacity:0.95;
    }

    @media (max-width:640px){
      .card{ gap:18px; padding:12px; }
      .logo{ width:120px; height:120px; }
    }

    .credit{
      position:fixed;
      bottom:12px;
      left:50%;
      transform:translateX(-50%);
      z-index:3;
      font-size:12px;
      color:rgba(255,255,255,0.46);
      letter-spacing:0.02em;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap" role="main">
    <section class="card" aria-labelledby="brand-title">
      <div class="brand" id="brand">
        <div class="logo" aria-hidden="true">
          <img src="logo.png?v=2" alt="Zozi Jewellery logo" id="logoImg">
        </div>

        <h1 id="brand-title">The countdown is almost over</h1>
        <div class="divider" aria-hidden="true"></div>
        <p class="lead">We’re thrilled to connect with you very soon.</p>

        <div class="services" aria-hidden="false">
          Jewellery Designer<br>
          Sketch<br>
          Rendering<br>
          Collection Development<br>
          Freelance Design Projects &amp; Education
        </div>

        <div class="actions">
          <a class="btn" id="instagramBtn" href="https://instagram.com/zozijewellery" target="_blank" rel="noopener noreferrer">
            <span class="dot" aria-hidden="true"></span>
            @zozijewellery
          </a>
        </div>
      </div>
    </section>
  </main>

  <div class="credit">All rights reserved · Zozi Jewellery © 2026</div>

  <script>
    // Minimal JS: set instagram link if needed later
    const instagramUrl = "https://instagram.com/zozijewellery";
    document.getElementById('instagramBtn').href = instagramUrl;
  </script>
</body>
</html>
